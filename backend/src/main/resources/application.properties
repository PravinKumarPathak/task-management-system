# ==========================================
# 1. Server & Application Setup
# ==========================================
spring.application.name=task-management-system
server.port=8080

# ==========================================
# 2. Database Connection (PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ==========================================
# 3. JPA / Hibernate Schema Management
# ==========================================
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# 4. Initial Database Seeding Configuration
# ==========================================
# Primary Admin Seed Credentials
app.seed.admin.username=${APP_SEED_ADMIN_USERNAME:pravin}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:pravin@tms.com}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Pravin123!}

# Development User: Alex
app.seed.alex.username=${APP_SEED_ALEX_USERNAME:alex}
app.seed.alex.email=${APP_SEED_ALEX_EMAIL:alex@tms.com}
app.seed.alex.password=${APP_SEED_ALEX_PASSWORD:Alex123!}

# Development User: Rohan
app.seed.rohan.username=${APP_SEED_ROHAN_USERNAME:rohan}
app.seed.rohan.email=${APP_SEED_ROHAN_EMAIL:rohan@tms.com}
app.seed.rohan.password=${APP_SEED_ROHAN_PASSWORD:Rohan123!}

# Development User: Sam
app.seed.sam.username=${APP_SEED_SAM_USERNAME:sam}
app.seed.sam.email=${APP_SEED_SAM_EMAIL:sam@tms.com}
app.seed.sam.password=${APP_SEED_SAM_PASSWORD:Sam123!}

# ==========================================
# 5. Security & JWT Configuration
# ==========================================
# Secret key must be at least 256 bits (32 characters) for HS256 algorithm
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_at_least_32_characters_long}

# Token expiration time in milliseconds (86400000 ms = 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# 6. Performance Optimization
# ==========================================
# Closes DB session after service layer to prevent connection pool exhaustion
spring.jpa.open-in-view=false

# ==========================================
# 7. Production Observability & Monitoring
# ==========================================
# Explicitly expose Actuator health endpoint for cloud hosting and keep-alive pings
management.endpoints.web.exposure.include=health

# ==========================================
# 8. Development Logging & Debugging
# ==========================================
# Print generated SQL queries to console
spring.jpa.show-sql=true

# Format SQL outputs across multiple clean lines for readability
spring.jpa.properties.hibernate.format_sql=true

# Verbose logging for Spring Security filter evaluation
logging.level.org.springframework.security=DEBUG

# Logging for Hibernate SQL execution details
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# 9. Transactional Mail Setup (Brevo API via HTTPS)
# ==========================================
# Brevo API Key for HTTP-based email delivery (bypasses Render port 587 block)
brevo.api.key=${BREVO_API_KEY:your_brevo_api_key}

# Address displayed to email recipients (must be verified in Brevo Senders dashboard)
app.mail.from-email=${MAIL_FROM_ADDRESS:noreply@example.com}

# ==========================================
# 10. Cloud Deployment & CORS Configuration
# ==========================================
# Frontend URL for password reset links and email generation
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Allowed Origin for CORS policy (supports local dev and live Vercel deployment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
