<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
      <div class="card shadow border-0 rounded-3">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-4">Welcome Back</h3>

          @if (invalidLogin()) {
            <div class="alert alert-danger alert-dismissible fade show shadow-sm mb-3" role="alert">
              {{ errorMessage() }}
              <button type="button" class="btn-close" (click)="invalidLogin.set(false)"></button>
            </div>
          }

          <form (ngSubmit)="!loginForm.invalid && handleJWTAuthLogin()" #loginForm="ngForm">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                [ngModel]="username()"
                (ngModelChange)="username.set($event)"
                required
              />
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold mb-0">Password</label>
                <a routerLink="/forgot-password" class="small text-decoration-none">Forgot?</a>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 fw-semibold mb-3 mt-2 shadow-sm"
              [disabled]="loginForm.invalid || isLoading()"
            >
              @if (isLoading()) {
                <span
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Signing In...
              } @else {
                Sign In
              }
            </button>
          </form>

          <div class="text-center small mt-3">
            <span class="text-muted">Don't have an account? </span>
            <a routerLink="/register" class="fw-bold text-decoration-none">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
