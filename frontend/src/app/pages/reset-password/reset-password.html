<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
      <div class="card shadow border-0 rounded-3">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-1">Set New Password</h3>
          <p class="text-muted text-center small mb-4">Please enter your new password below.</p>

          <!-- API / Token Error Alert -->
          @if (errorMessage()) {
            <div
              class="alert alert-danger alert-dismissible fade show shadow-sm mb-3 small"
              role="alert"
            >
              {{ errorMessage() }}
              <button
                type="button"
                class="btn-close py-2"
                (click)="errorMessage.set(undefined)"
              ></button>
            </div>
          }

          <form (ngSubmit)="!resetForm.invalid && performReset()" #resetForm="ngForm">
            <!-- Password Control -->
            <div class="mb-4">
              <label for="newPassword" class="form-label fw-semibold">New Password</label>
              <input
                type="password"
                id="newPassword"
                #passwordInput="ngModel"
                class="form-control"
                [class.is-invalid]="passwordInput.touched && passwordInput.invalid"
                [(ngModel)]="newPassword"
                name="newPassword"
                required
                minlength="6"
                placeholder="Minimum 6 characters"
              />
              @if (passwordInput.touched && passwordInput.invalid) {
                <div class="invalid-feedback">Password must be at least 6 characters long.</div>
              }
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-primary w-100 mb-3 py-2 fw-semibold shadow-sm"
              [disabled]="resetForm.invalid || !token || isLoading()"
            >
              @if (isLoading()) {
                <span
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Updating Password...
              } @else {
                Update Password
              }
            </button>
          </form>

          <!-- Navigation Link -->
          <div class="text-center small">
            <a routerLink="/login" class="fw-semibold text-decoration-none">Back to Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
