<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-4 bg-light">
        <div class="card-body">
          <div class="mb-3 text-warning fs-1">🔍</div>
          <h3 class="fw-bold text-dark mb-3">404 - Page Not Found</h3>
          <p class="text-muted mb-4">{{ errorMessage }}</p>
          <div class="d-flex justify-content-center gap-2">
            @if (authStore.isUserLoggedIn()) {
              <a routerLink="/welcome" class="btn btn-primary px-4 shadow-sm">
                Back to Dashboard
              </a>
            } @else {
              <a routerLink="/login" class="btn btn-primary px-4 shadow-sm"> Sign In </a>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
